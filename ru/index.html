<script>
/* Ставим тему ДО отрисовки, иначе при выбранной светлой теме страница
   моргнёт тёмной (FOUC). Обязан быть в <head> и без defer. */
(function(){var r=document.documentElement,dark=false;
function light(){r.setAttribute('data-theme','light');}
try{var t=localStorage.getItem('dorxmoon.theme');
/* Светлая — тема по умолчанию: тёмная включается только явным выбором. */
if(t!=='dark')light();else dark=true;}catch(e){light();}
/* Цвет панели браузера обязан совпасть с фоном СРАЗУ: JS правит мету только
   по клику, и при сохранённой тёмной теме панель осталась бы светлой. */
if(dark){var m=document.querySelector('meta[name="theme-color"]');
if(m)m.setAttribute('content','#0d0f12');}})();
</script>

<!-- ═══ МОДАЛКА КЕЙСА ═══ содержимое подставляется из projects.js -->
<div class="modal" id="modal" hidden>
  <div class="modal-back" data-close></div>
  <div class="modal-box" role="dialog" aria-modal="true">
    <button class="modal-x" type="button" data-close aria-label="Close">✕</button>
    <div class="modal-scroll" id="modalBody"></div>
  </div>
</div>

<!-- ═══ МОДАЛКА ВИДЕО-ОТЗЫВА ═══ отдельная от модалки кейса: здесь звук,
     и видео обязано останавливаться при закрытии, иначе играет за кадром. -->
<div class="vmodal" id="vmodal" hidden>
  <div class="vmodal-back" data-vclose></div>
  <!-- Тот же корпус телефона, что и в карточке: при открытии он «подъезжает»
       к экрану из своего места на странице (см. FLIP-анимацию в app.js), а не
       подменяется голым прямоугольником с видео. -->
  <div class="vmodal-box" role="dialog" aria-modal="true">
    <div class="rv-phone vm-phone" id="vmodalPhone">
      <span class="rv-btn rv-btn-vol1"></span>
      <span class="rv-btn rv-btn-vol2"></span>
      <span class="rv-btn rv-btn-pwr"></span>
      <span class="rv-screen">
        <!-- Без атрибута controls: панель управления рисует player() в app.js.
             Штатное меню Chrome («Субтитры», «Скорость») — белая системная
             плашка поверх кадра, её нельзя ни оформить, ни перевести. -->
        <video class="vmodal-video" id="vmodalVideo" playsinline preload="none"
               disablepictureinpicture></video>
        <span class="rv-island"></span>
      </span>
    </div>
    <button class="vmodal-x" type="button" data-vclose aria-label="Close">✕</button>
  </div>
</div>

<!-- ═══ ПРОСМОТР СКРИНШОТА ═══ общий для всех виджетов кейса: зум колесом,
     перетаскивание, стрелки между кадрами. Отдельный слой, а не часть модалки
     кейса, — иначе прокрутка кейса утаскивала бы за собой открытое фото. -->
<div class="lbox" id="lbox" hidden>
  <div class="lbox-back" data-lclose></div>
  <div class="lbox-stage" id="lboxStage" role="dialog" aria-modal="true">
    <img class="lbox-img" id="lboxImg" src="" alt="" draggable="false">
  </div>
  <button class="lbox-x" type="button" data-lclose aria-label="Close">✕</button>
  <button class="lbox-nav lbox-prev" type="button" id="lboxPrev" aria-label="Prev">‹</button>
  <button class="lbox-nav lbox-next" type="button" id="lboxNext" aria-label="Next">›</button>
  <div class="lbox-bar">
    <span class="lbox-cap" id="lboxCap"></span>
    <span class="lbox-hint" id="lboxHint"></span>
  </div>
</div>
